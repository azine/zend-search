name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: PHP 8.5 / Zend Search compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          extensions: iconv, mbstring
          tools: composer:v2

      - name: Cache Composer downloads
        uses: actions/cache@v5
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-php85-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ runner.os }}-php85-

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction

      - name: Lint all PHP source files
        run: composer lint

      - name: Run Lucene smoke tests
        run: composer test
